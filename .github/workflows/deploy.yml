name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::793593623405:role/github-actions-deploy
          aws-region: us-east-1

      - name: Upload to S3
        run: aws s3 sync . s3://asteroid-game-otim-2026-793593623405-us-east-1-an --delete --exclude ".git/*" --exclude ".github/*" --exclude "README.md"

      - name: Clear CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1ZVAPU4CB0800 --paths "/*"