name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          {
            echo '```json'
            python3 -c "import sys,json,base64; t=sys.argv[1].split('.')[1]; t+='='*(-len(t)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(t)),indent=1))" "$TOKEN"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::793593623405:role/github-actions-deploy
          aws-region: us-east-1

      - name: Upload to S3
        run: aws s3 sync . s3://asteroid-game-otim-2026-793593623405-us-east-1-an --delete --exclude ".git/*" --exclude ".github/*" --exclude "README.md"

      - name: Clear CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1ZVAPU4CB0800 --paths "/*"
